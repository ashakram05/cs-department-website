name: CI Pipeline

on:
  push:
    branches: [ develop, release/*, main ]
  pull_request:
    branches: [ develop, release/*, main ]

jobs:
  # ─────────────────────────────────────────────
  # JOB 1: Lint HTML & CSS
  # ─────────────────────────────────────────────
  lint:
    name: Lint HTML & CSS
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install HTMLHint
        run: npm install -g htmlhint

      - name: Run HTMLHint
        run: htmlhint "**/*.html" --config .htmlhintrc

      - name: Install stylelint
        run: npm install -g stylelint stylelint-config-standard

      - name: Run Stylelint
        run: stylelint "**/*.css" --config '{"extends":"stylelint-config-standard"}' || true

  # ─────────────────────────────────────────────
  # JOB 2: Build Docker Image
  # ─────────────────────────────────────────────
  docker-build:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs: lint

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image (no push)
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          tags: cs-department-website:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verify image builds successfully
        run: echo "Docker image built successfully for commit ${{ github.sha }}"
